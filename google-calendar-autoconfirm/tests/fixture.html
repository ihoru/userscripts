<script>
window.actions = [];
window.hold = false;
window.showDialog = (selected = 'Woal0c') => {
  const shell = document.querySelector('#dialog-template').content.firstElementChild.cloneNode(true);
  const dialog = shell.querySelector('[role="dialog"]');
  dialog.querySelectorAll('input[type="radio"]').forEach(r => {
    r.checked = r.value === selected;
    r.addEventListener('change', () => actions.push('select:' + r.value));
  });
  dialog.querySelector('[data-mdc-dialog-action="ok"]').addEventListener('click', () => {
    actions.push('ok:' + dialog.querySelector('input:checked').value);
    if (!hold) setTimeout(() => shell.remove(), 100);
  });
  dialog.querySelector('[data-mdc-dialog-action="cancel"]').addEventListener('click', () => shell.remove());
  document.querySelector('#slot').append(shell);
  return dialog;
};
</script>
